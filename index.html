<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A&G Best Ball Leagues</title>
  
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse for Google Sheet CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Chart.js for the line chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Chart.js DataLabels Plugin for numbers inside points -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

  <!-- Tom Select for the searchable dropdown -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  
  <style>
    /* Slight override to make Tom Select match Tailwind styling better */
    .ts-control { border-radius: 0.5rem; padding: 0.75rem; border-color: #cbd5e1; background-color: #f8fafc; font-weight: 600; }
    .ts-control.focus { border-color: #22c55e; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2); }
  </style>
</head>
<body class="bg-white text-slate-800 p-2 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg border border-slate-200 overflow-hidden">
    
    <!-- Header Section -->
    <div class="bg-green-950 p-5 md:p-6 border-b-4 border-slate-300">
      <div class="uppercase tracking-widest text-white font-extrabold text-xl md:text-2xl mb-1">A&G Best Ball Leagues</div>
      <h1 id="page-subtitle" class="text-lg md:text-xl font-bold text-slate-300">Player ADP Summary</h1>
    </div>

    <!-- Tab Navigation -->
    <div class="flex border-b border-slate-200 bg-slate-50">
      <button id="btn-tab-summary" onclick="switchTab('summary')" class="flex-1 py-3 text-center font-bold text-sm md:text-base border-b-4 border-green-600 text-green-700 bg-white transition-colors">
        ADP Summary
      </button>
      <button id="btn-tab-player" onclick="switchTab('player')" class="flex-1 py-3 text-center font-bold text-sm md:text-base border-b-4 border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors">
        Player Analysis
      </button>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="text-center text-slate-500 font-medium p-12">
      <svg class="animate-spin h-8 w-8 text-green-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Loading draft data...
    </div>

    <!-- MAIN CONTENT AREA -->
    <div id="app-content" class="hidden">
      
      <!-- ========================================== -->
      <!-- VIEW 1: ADP SUMMARY                        -->
      <!-- ========================================== -->
      <div id="view-summary" class="block">
        <div class="overflow-x-auto p-2 md:p-4">
          <table class="w-full text-left border-collapse min-w-[500px]" id="adp-table">
            <thead>
              <tr class="border-b-2 border-slate-200 text-xs md:text-sm uppercase text-slate-500 tracking-wide">
                <th class="p-3 font-semibold w-12 text-center">Rank</th>
                <th class="p-3 font-semibold text-center w-20">Team</th>
                <th class="p-3 font-semibold">Player</th>
                <th class="p-3 font-semibold text-center w-16">Pos</th>
                <th class="p-3 font-semibold text-right w-20">ADP</th>
              </tr>
            </thead>
            <tbody class="text-sm md:text-base">
              <!-- Injected by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- VIEW 2: PLAYER ANALYSIS                    -->
      <!-- ========================================== -->
      <div id="view-player" class="hidden p-4 md:p-6">
        
        <!-- Player Selector (Searchable) -->
        <div class="mb-6">
          <label for="player-select" class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Search & Select Player</label>
          <div class="w-full md:w-1/2">
            <select id="player-select" placeholder="Type a player's name..." class="w-full">
              <!-- Options injected by JS -->
            </select>
          </div>
        </div>

        <!-- Player Profile Card -->
        <div class="flex items-center gap-4 bg-slate-50 border border-slate-200 p-4 rounded-xl mb-8 shadow-sm">
          <img id="profile-logo" src="" alt="Team Logo" class="h-16 w-16 md:h-20 md:w-20 object-contain drop-shadow-sm">
          <div class="flex-1">
            <h2 id="profile-name" class="text-2xl md:text-3xl font-extrabold text-slate-900">Player Name</h2>
            <div class="flex items-center gap-3 mt-1">
              <span id="profile-pos" class="px-2.5 py-1 text-xs md:text-sm font-bold rounded-md shadow-sm text-white">POS</span>
              <span class="text-slate-500 font-medium">|</span>
              <span class="text-slate-700 font-bold">Overall ADP: <span id="profile-adp" class="text-slate-900 font-mono">0.0</span></span>
            </div>
          </div>
        </div>

        <!-- Chart Section -->
        <div class="mb-8">
          <h3 class="text-lg font-bold text-slate-800 mb-4 border-b border-slate-200 pb-2">Draft Position Trend</h3>
          <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm relative h-[300px] md:h-[400px]">
            <canvas id="draftChart"></canvas>
          </div>
        </div>

        <!-- Team History Table -->
        <div>
          <h3 class="text-lg font-bold text-slate-800 mb-4 border-b border-slate-200 pb-2">Fantasy Team Draft History</h3>
          <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-sm">
            <table class="w-full text-left border-collapse" id="team-history-table">
              <thead>
                <tr class="bg-slate-100 text-xs md:text-sm uppercase text-slate-500 tracking-wide border-b border-slate-200">
                  <th class="p-3 font-semibold">Fantasy Team</th>
                  <th class="p-3 font-semibold text-center">Times Drafted</th>
                  <th class="p-3 font-semibold text-center">Personal ADP</th>
                </tr>
              </thead>
              <tbody class="text-sm md:text-base text-slate-700">
                <!-- Rows injected by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    // Register the DataLabels plugin globally for Chart.js
    Chart.register(ChartDataLabels);

    const csvUrl = "https://docs.google.com/spreadsheets/d/1wOBSMgmj3T_5ijNpnr4KacV7b7p189JoYh91FoblzT4/gviz/tq?tqx=out:csv&sheet=clean_draft_results";
    
    // Global state
    let chartInstance = null;
    let playersData = {}; // Raw object map
    let sortedPlayersArray = []; // Array sorted by ADP
    let tomSelectInstance = null; // Reference to the search dropdown

    // Helpers
    function getTeamLogoUrl(teamCode) {
      if (!teamCode) return '';
      return `https://assets.nhle.com/logos/nhl/svg/${teamCode.toUpperCase().trim()}_light.svg`;
    }

    function getPosColorClass(pos) {
      if(pos === "C") return "bg-red-500 text-white";
      if(pos === "RW") return "bg-blue-500 text-white";
      if(pos === "LW") return "bg-orange-500 text-white";
      if(pos === "D") return "bg-purple-500 text-white";
      if(pos === "G") return "bg-black text-white";
      return "bg-slate-200 text-slate-800"; // fallback
    }

    // Tab Logic
    function switchTab(tabName) {
      const viewSummary = document.getElementById('view-summary');
      const viewPlayer = document.getElementById('view-player');
      const btnSummary = document.getElementById('btn-tab-summary');
      const btnPlayer = document.getElementById('btn-tab-player');
      const subtitle = document.getElementById('page-subtitle');

      if (tabName === 'summary') {
        viewSummary.classList.replace('hidden', 'block');
        viewPlayer.classList.replace('block', 'hidden');
        
        btnSummary.className = "flex-1 py-3 text-center font-bold text-sm md:text-base border-b-4 border-green-600 text-green-700 bg-white transition-colors";
        btnPlayer.className = "flex-1 py-3 text-center font-bold text-sm md:text-base border-b-4 border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors";
        
        subtitle.textContent = "Player ADP Summary";
      } else {
        viewSummary.classList.replace('block', 'hidden');
        viewPlayer.classList.replace('hidden', 'block');
        
        btnPlayer.className = "flex-1 py-3 text-center font-bold text-sm md:text-base border-b-4 border-green-600 text-green-700 bg-white transition-colors";
        btnSummary.className = "flex-1 py-3 text-center font-bold text-sm md:text-base border-b-4 border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors";
        
        subtitle.textContent = "Player Analysis";
      }
    }

    // Fetch and Process Data
    Papa.parse(csvUrl, {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: function(results) {
        const rawData = results.data;

        // 1. Group data by player_id
        rawData.forEach(row => {
          if (!row.player_id || !row.pick_number) return;
          
          if (!playersData[row.player_id]) {
            playersData[row.player_id] = {
              id: row.player_id,
              name: row.player,
              pos: row.pos,
              team: row.team,
              picks: []
            };
          }
          playersData[row.player_id].picks.push({
            league: row.league,
            pick_number: row.pick_number,
            fantasy_team: row.FANTASY_TEAM
          });
        });

        // 2. Calculate ADP and Sort
        sortedPlayersArray = Object.values(playersData).map(player => {
           const total = player.picks.reduce((sum, p) => sum + p.pick_number, 0);
           player.overallAdp = total / player.picks.length;
           player.picks.sort((a, b) => a.league - b.league); // Sort picks chronologically
           return player;
        });
        sortedPlayersArray.sort((a, b) => a.overallAdp - b.overallAdp);

        // 3. Build ADP Table & Dropdown
        buildAdpTable();
        buildPlayerDropdown();

        // Reveal UI
        document.getElementById("loading-state").classList.add("hidden");
        document.getElementById("app-content").classList.remove("hidden");
      },
      error: function() {
        document.getElementById("loading-state").innerHTML = '<span class="text-red-500 font-bold">Failed to load data. Make sure the Google Sheet is public.</span>';
      }
    });

    function buildAdpTable() {
      const tbody = document.querySelector("#adp-table tbody");
      sortedPlayersArray.forEach((player, index) => {
        const tr = document.createElement("tr");
        tr.className = "border-b hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <td class="p-3 font-semibold text-slate-500 text-center">${index + 1}</td>
          <td class="p-3 text-center align-middle">
            <img src="${getTeamLogoUrl(player.team)}" alt="${player.team}" 
                 class="h-12 w-12 md:h-16 md:w-16 object-contain inline-block drop-shadow-sm"
                 onerror="this.style.display='none';"> 
          </td>
          <td class="p-3 font-bold text-slate-900 text-base md:text-lg whitespace-nowrap">${player.name}</td>
          <td class="p-3 text-center">
            <span class="px-2.5 py-1 text-xs md:text-sm font-bold rounded-md shadow-sm ${getPosColorClass(player.pos)}">${player.pos}</span>
          </td>
          <td class="p-3 text-right font-mono font-bold text-slate-700 text-base md:text-lg">${player.overallAdp.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function buildPlayerDropdown() {
      const selectEl = document.getElementById("player-select");
      
      // Inject options (Name only)
      sortedPlayersArray.forEach((p) => {
        const option = document.createElement("option");
        option.value = p.id;
        option.textContent = p.name;
        selectEl.appendChild(option);
      });

      // Initialize Tom Select for searching
      tomSelectInstance = new TomSelect("#player-select", {
        create: false,
        sortField: { field: "$order" }, // Keeps the array sorted exactly how we fed it (by ADP)
        placeholder: "Type a player's name..."
      });

      // Listen for changes
      tomSelectInstance.on("change", (value) => {
        if(value) updatePlayerView(playersData[value]);
      });

      // Load first player by default
      if (sortedPlayersArray.length > 0) {
        tomSelectInstance.setValue(sortedPlayersArray[0].id);
      }
    }

    function updatePlayerView(player) {
      // Profile Header
      document.getElementById("profile-name").textContent = player.name;
      document.getElementById("profile-adp").textContent = player.overallAdp.toFixed(1);
      
      const logoEl = document.getElementById("profile-logo");
      logoEl.src = getTeamLogoUrl(player.team);
      logoEl.onerror = () => { logoEl.style.display = 'none'; };
      logoEl.style.display = 'block';

      const posEl = document.getElementById("profile-pos");
      posEl.textContent = player.pos;
      posEl.className = `px-2.5 py-1 text-xs md:text-sm font-bold rounded-md shadow-sm ${getPosColorClass(player.pos)}`;

      // Chart - Format X labels as BB1, BB2, etc.
      const leagues = player.picks.map(p => `BB${p.league}`);
      const pickPositions = player.picks.map(p => p.pick_number);

      const ctx = document.getElementById('draftChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: leagues,
          datasets: [{
            label: 'Draft Position',
            data: pickPositions,
            borderColor: '#94a3b8', // Slate-400 for the line
            backgroundColor: 'rgba(100, 116, 139, 0.1)', // Subtle grey fill
            borderWidth: 3,
            pointBackgroundColor: '#475569', // Slate-600 for the points
            pointRadius: 14, // Made large enough to fit double/triple digits inside
            pointHoverRadius: 16,
            fill: true,
            tension: 0.1 
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              ticks: {
                maxRotation: 45, // Lock labels to 45 degrees
                minRotation: 45
              }
            },
            y: {
              beginAtZero: true, // Start at 0 on the bottom
              grace: 3, // Adds a buffer of 3 units above the highest draft pick
              ticks: {
                stepSize: 1, // Ensure only whole integers are shown
                precision: 0
              },
              title: { display: true, text: 'Overall Pick Number', font: { weight: 'bold' } }
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                afterLabel: function(context) {
                  return `Drafted by: ${player.picks[context.dataIndex].fantasy_team}`;
                }
              }
            },
            datalabels: {
              color: '#ffffff', // White text inside the grey circles
              font: {
                weight: 'bold',
                size: 11
              },
              align: 'center', // Centers the label directly inside the point
              formatter: function(value) {
                return value; // Displays the pick_number
              }
            }
          }
        }
      });

      // Team History Table
      const teamStats = {};
      player.picks.forEach(p => {
        if (!teamStats[p.fantasy_team]) teamStats[p.fantasy_team] = { count: 0, sum: 0 };
        teamStats[p.fantasy_team].count += 1;
        teamStats[p.fantasy_team].sum += p.pick_number;
      });

      const teamArray = Object.keys(teamStats).map(name => ({
        name,
        count: teamStats[name].count,
        personalAdp: teamStats[name].sum / teamStats[name].count
      })).sort((a, b) => b.count - a.count);

      const tbody = document.querySelector("#team-history-table tbody");
      tbody.innerHTML = "";
      
      if (teamArray.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">No draft data found.</td></tr>`;
      } else {
        teamArray.forEach(t => {
          const tr = document.createElement("tr");
          tr.className = "border-b hover:bg-slate-50 transition-colors";
          tr.innerHTML = `
            <td class="p-3 font-bold text-slate-900">${t.name}</td>
            <td class="p-3 text-center font-semibold text-slate-600">${t.count}</td>
            <td class="p-3 text-center font-mono font-bold text-slate-700">${t.personalAdp.toFixed(1)}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    }
  </script>
</body>
</html>
